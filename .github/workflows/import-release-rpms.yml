name: Import release RPMs

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rpm-repository-update
  cancel-in-progress: false

jobs:
  import-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Install RPM repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm createrepo-c zstd
      - name: Import pinned release assets and rebuild metadata
        run: python3 scripts/import-release-rpms.py
      - name: Validate repository
        run: python3 scripts/validate-repo.py
      - name: Check GitHub Pages artifact size
        run: python3 scripts/check-pages-size.py
      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages repodata README.md
          if git diff --cached --quiet; then
            echo "No repository changes to publish."
            exit 0
          fi
          git commit -m "Import RPM release assets and refresh metadata"
          git push origin HEAD:main
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
